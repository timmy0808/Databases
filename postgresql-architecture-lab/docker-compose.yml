name: postgresql-architecture-lab

services:
  postgres:
    image: postgres:17-alpine
    container_name: postgresql-architecture-lab
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-saas_lab}
      POSTGRES_USER: ${POSTGRES_USER:-lab_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-development}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - log_min_duration_statement=250
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
    name: postgresql-architecture-lab-data

